name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_POSTGRES_PASSWORD: postgres
  CI_POSTGRES_DB: postgres
  CI_API_DB_PASSWORD: castly-ci-test-password

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit-test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/core test
      - run: pnpm --filter @workspace/schema test
      - run: pnpm --filter @workspace/portfolio-native test
      - run: pnpm --filter @workspace/portfolio-web test
      - run: pnpm --filter @workspace/portfolio-parity test
      - run: pnpm --filter web test
      - run: pnpm --filter api test:unit

  integration-test:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_API_URL: postgresql://castly_api:castly-ci-test-password@localhost:5432/postgres
      API_DB_PASSWORD: castly-ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Auth schema stub
        run: psql "$DATABASE_URL" -f packages/db/ci/postgres-auth-stub.sql
      - run: pnpm db:migrate
      - run: pnpm --filter @workspace/db db:assert-talent
      - run: pnpm --filter @workspace/db db:assert-talent-search
      - run: pnpm db:provision-api-role
      - run: pnpm --filter api test:integration

  drizzle-check:
    name: drizzle migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db db:check

  prohibited-attribute-guard:
    name: prohibited-attribute guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/ci/prohibited-attribute-guard.mjs
